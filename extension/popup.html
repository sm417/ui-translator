<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    --line: #e3e5e8;
    --ink: #1f2328;
    --sub: #6b7280;
    --accent: #2563eb;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    width: 342px;
    margin: 0;
    padding: 14px 14px 12px;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .2px;
  }
  h1 span { color: var(--sub); font-weight: 400; font-size: 11px; margin-left: 6px; }
  .main {
    width: 100%;
    padding: 10px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .main:hover { filter: brightness(1.06); }
  .main.off { background: #eef1f6; color: var(--ink); }
  .main:disabled { opacity: .6; cursor: default; }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .row label { color: var(--sub); width: 62px; flex: none; }
  select, input[type=text], input[type=password] {
    flex: 1;
    min-width: 0;
    padding: 5px 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    font: 12px/1.4 inherit;
  }
  .chk {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--ink);
    white-space: nowrap;
    flex: none;
  }
  .chk input { margin: 0; flex: none; }
  #llmBox {
    margin-top: 10px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fafbfc;
    display: none;
  }
  #llmBox .row { margin-top: 8px; }
  #llmBox .row:first-child { margin-top: 0; }
  .hint { color: var(--sub); font-size: 11px; margin-top: 6px; }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    color: var(--sub);
    font-size: 11px;
  }
  .link { color: var(--accent); cursor: pointer; text-decoration: none; }
  #status { margin-top: 8px; min-height: 16px; font-size: 11.5px; color: var(--sub); }
  #status.err { color: #c0392b; }
</style>
</head>
<body>
  <h1>界面翻译<span>只翻界面，不碰代码</span></h1>

  <button id="btn" class="main">翻译此页</button>
  <div id="status"></div>

  <div class="row">
    <label>引擎</label>
    <select id="engine">
      <option value="free">腾讯翻译（免费免 key）</option>
      <option value="llm">大模型（质量最好）</option>
    </select>
  </div>

  <div class="row">
    <label>显示</label>
    <select id="mode">
      <option value="bilingual">中英对照（原文+译文）</option>
      <option value="replace">直接替换（只留中文）</option>
    </select>
  </div>

  <div class="row" style="margin-top:8px">
    <label class="chk"><input type="checkbox" id="hover"> <span>悬停看原文</span></label>
    <label class="chk" style="margin-left:auto"><input type="checkbox" id="auto"> <span>新页面自动翻</span></label>
  </div>

  <div id="llmBox">
    <div class="row">
      <label>接口</label>
      <input type="text" id="apiBase" placeholder="https://api.deepseek.com/v1">
    </div>
    <div class="row">
      <label>模型</label>
      <input type="text" id="model" placeholder="deepseek-chat">
    </div>
    <div class="row">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="sk-...">
    </div>
    <div class="hint">Key 只存在本机浏览器里，不会上传别处。接口填 OpenAI 兼容格式即可（DeepSeek / 通义 / Kimi / 本地 ollama 都行）。日常用「腾讯翻译」就够；要术语准、句子顺，再切这里。</div>
  </div>

  <div class="foot">
    <span>快捷键 Alt+T 翻译 / 还原</span>
    <a class="link" id="clear">清缓存</a>
  </div>

<script src="popup.js"></script>
</body>
</html>
